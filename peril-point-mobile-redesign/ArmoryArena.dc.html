<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Armory — arena</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#08090E;color:#E6E9F0;font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#C7CDDB}a:hover{color:#E6E9F0}
button{font-family:'IBM Plex Sans',sans-serif}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; background: #0B0E14; display: flex; flex-direction: column; overflow: hidden; color: #E6E9F0; font-family: 'IBM Plex Sans', sans-serif;">
  <div style="height: 64px; box-sizing: border-box; padding: 8px 28px 8px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1B2029; flex-shrink: 0;">
    <a href="Main.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: 48px; height: 48px; flex-shrink: 0; border: 1px solid #262C38; border-radius: 6px; background: rgba(20,24,33,0.85); text-decoration: none; cursor: pointer; padding: 0; background: transparent;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 L5 8 L10 13" stroke="#C7CDDB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    <h2 style="margin: 0 6px 0 2px; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 700; font-stretch: 112%; font-size: 21px; line-height: 1;">Armory</h2>
    <nav aria-label="Armory sections" style="display: flex; gap: 2px;"><a href="ArmoryWeapons.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; color: #7A8397; font-size: 14px; font-weight: 500; text-decoration: none;">Weapons</a><a href="ArmoryShips.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; color: #7A8397; font-size: 14px; font-weight: 500; text-decoration: none;">Ships</a><a href="ArmoryArena.dc.html" aria-current="page" style="display: flex; align-items: center; height: 48px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; background: #1B2029; color: #E6E9F0; font-size: 14px; font-weight: 600; text-decoration: none;">Arena</a><a href="ArmoryHandling.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; color: #7A8397; font-size: 14px; font-weight: 500; text-decoration: none;">Handling</a><a href="ArmoryBoosts.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; color: #7A8397; font-size: 14px; font-weight: 500; text-decoration: none;">Boosts</a></nav>
    <div style="flex-grow: 1;"></div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; color: #FFB14D;">7,331 <span style="font-size: 10px; letter-spacing: 0.1em; color: #A08A5C;">PTS</span></span><a href="ColdOpen.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; border: none; border-radius: 6px; background: #5B8CFF; color: #08090E; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer; height: 48px; width: 92px; font-size: 15px; margin-left: 6px;">Play</a>
  </div>
  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 12px 0 14px 24px; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; color: #7A8397;">Arena</span>
    <div style="display: flex; gap: 10px; overflow: hidden;"><sc-for list="{{themes}}" as="c" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{c.pressed}}" style="width: 146px; flex-shrink: 0; box-sizing: border-box; padding: 0; background: #141821; border: 1px solid {{c.border}}; border-radius: 6px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; text-align: left;">
          <span style="display: block; position: relative; width: 100%; height: 56px; background-color: #0D1016; background-image: linear-gradient({{c.grid}} 1px, transparent 1px), linear-gradient(90deg, {{c.grid}} 1px, transparent 1px); background-size: 12px 12px; border-bottom: 1px solid #1B2029;"><span style="position: absolute; left: 8px; top: 7px; right: 8px; bottom: 7px; border: 1px solid {{c.edge}}; border-radius: 2px; display: block;"></span></span>
          <span style="box-sizing: border-box; width: 100%; padding: 8px 10px 9px; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 13px; font-weight: 600; color: {{c.fg}};">{{c.name}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; color: {{c.stateFg}};">{{c.state}}</span>
          </span>
        </button>
      </sc-for></div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; color: #7A8397; margin-top: 4px;">Enemies</span>
    <div style="display: flex; gap: 10px; overflow: hidden;"><sc-for list="{{enemies}}" as="c" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{c.pressed}}" style="width: 146px; flex-shrink: 0; box-sizing: border-box; padding: 0; background: #141821; border: 1px solid {{c.border}}; border-radius: 6px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; text-align: left;">
          <span style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 56px; background: #0D1016; border-bottom: 1px solid #1B2029;"><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: {{c.body}}; border: 1px solid {{c.rim}}; box-shadow: 0 0 10px {{c.glow}}; display: block;"></span><span style="width: 9px; height: 9px; box-sizing: border-box; border-radius: 50%; background: {{c.body}}; border: 1px solid {{c.rim}}; box-shadow: 0 0 8px {{c.glow}}; display: block;"></span><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: {{c.body}}; border: 1px solid {{c.rim}}; box-shadow: 0 0 10px {{c.glow}}; display: block;"></span></span>
          <span style="box-sizing: border-box; width: 100%; padding: 8px 10px 9px; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 13px; font-weight: 600; color: {{c.fg}};">{{c.name}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; color: {{c.stateFg}};">{{c.state}}</span>
          </span>
        </button>
      </sc-for></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 844, "height": 390}}'>
class Component extends DCLogic {
  renderVals() {
    const st = (s) => s === 'Equipped'
      ? { state: '\u2713 Equipped', stateFg: '#3DDC97', border: '#3DDC97', fg: '#E6E9F0', pressed: 'true' }
      : s === 'Owned' ? { state: 'Owned', stateFg: '#99A1B3', border: '#262C38', fg: '#E6E9F0', pressed: 'false' }
      : { state: s + ' pts', stateFg: '#FFB14D', border: '#262C38', fg: '#C7CDDB', pressed: 'false' };
    return {
      themes: [
        { name: 'Void', grid: 'rgba(91,140,255,0.18)', edge: 'rgba(91,140,255,0.5)', ...st('Equipped') },
        { name: 'Synthwave', grid: 'rgba(255,0,160,0.22)', edge: 'rgba(255,0,180,0.55)', ...st('Owned') },
        { name: 'Nebula', grid: 'rgba(130,90,255,0.22)', edge: 'rgba(150,100,255,0.55)', ...st('600') },
        { name: 'Matrix', grid: 'rgba(0,255,120,0.2)', edge: 'rgba(0,255,120,0.5)', ...st('800') },
        { name: 'Furnace', grid: 'rgba(255,130,0,0.24)', edge: 'rgba(255,140,0,0.55)', ...st('1,000') },
        { name: 'Blueprint', grid: 'rgba(255,255,255,0.22)', edge: 'rgba(255,255,255,0.6)', ...st('1,200') }
      ],
      enemies: [
        { name: 'Crimson', body: '#FF4757', rim: '#ff8899', glow: 'rgba(255,30,60,0.6)', ...st('Equipped') },
        { name: 'Toxic', body: '#22e07a', rim: '#aaffbb', glow: 'rgba(0,255,100,0.55)', ...st('400') },
        { name: 'Glitch', body: '#5B8CFF', rim: '#ff0077', glow: 'rgba(91,140,255,0.6)', ...st('600') },
        { name: 'Magma', body: '#ff7a1a', rim: '#ffaa33', glow: 'rgba(255,120,0,0.6)', ...st('800') },
        { name: 'Void', body: '#9d3dff', rim: '#cc88ff', glow: 'rgba(180,50,255,0.6)', ...st('1,000') },
        { name: 'Midas', body: '#ffd21f', rim: '#fff088', glow: 'rgba(255,215,0,0.55)', ...st('1,500') }
      ]
    };
  }
}
</script>
</body>
</html>
