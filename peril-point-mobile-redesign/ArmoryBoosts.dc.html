<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Armory — boosts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#08090E;color:#E6E9F0;font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#C7CDDB}a:hover{color:#E6E9F0}
button{font-family:'IBM Plex Sans',sans-serif}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; background: #0B0E14; display: flex; flex-direction: column; overflow: hidden; color: #E6E9F0; font-family: 'IBM Plex Sans', sans-serif;">
  <div style="height: 64px; box-sizing: border-box; padding: 8px 28px 8px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1B2029; flex-shrink: 0;">
    <a href="Main.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: 48px; height: 48px; flex-shrink: 0; border: 1px solid #262C38; border-radius: 6px; background: rgba(20,24,33,0.85); text-decoration: none; cursor: pointer; padding: 0; background: transparent;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 L5 8 L10 13" stroke="#C7CDDB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    <h2 style="margin: 0 6px 0 2px; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 700; font-stretch: 112%; font-size: 21px; line-height: 1;">Armory</h2>
    <nav aria-label="Armory sections" style="display: flex; gap: 2px;"><a href="ArmoryWeapons.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; color: #7A8397; font-size: 14px; font-weight: 500; text-decoration: none;">Weapons</a><a href="ArmoryShips.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; color: #7A8397; font-size: 14px; font-weight: 500; text-decoration: none;">Ships</a><a href="ArmoryArena.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; color: #7A8397; font-size: 14px; font-weight: 500; text-decoration: none;">Arena</a><a href="ArmoryHandling.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; color: #7A8397; font-size: 14px; font-weight: 500; text-decoration: none;">Handling</a><a href="ArmoryBoosts.dc.html" aria-current="page" style="display: flex; align-items: center; height: 48px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; background: #1B2029; color: #E6E9F0; font-size: 14px; font-weight: 600; text-decoration: none;">Boosts</a></nav>
    <div style="flex-grow: 1;"></div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; color: #FFB14D;">7,331 <span style="font-size: 10px; letter-spacing: 0.1em; color: #A08A5C;">PTS</span></span><a href="ColdOpen.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; border: none; border-radius: 6px; background: #5B8CFF; color: #08090E; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer; height: 48px; width: 92px; font-size: 15px; margin-left: 6px;">Play</a>
  </div>
  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 14px 28px 16px 24px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: baseline; gap: 12px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #7A8397;">Boosts</span>
      <span style="font-size: 13px; color: #7A8397;">Permanent. They stack into every run.</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{boosts}}" as="b" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 14px; height: 76px; box-sizing: border-box; padding: 0 13px 0 16px; background: #141821; border: 1px solid #262C38; border-radius: 6px;">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px;">
            <div style="display: flex; align-items: baseline; gap: 10px;">
              <strong style="font-size: 14px; font-weight: 600;">{{b.name}}</strong>
              <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; color: #99A1B3;">{{b.effect}}</span>
            </div>
            <div style="display: flex; gap: 4px; max-width: 180px;" aria-label="{{b.rankLabel}}">
              <sc-for list="{{b.pips}}" as="p" hint-placeholder-count="3"><span style="flex-grow: 1; height: 5px; border-radius: 2px; background: {{p.fill}}; display: block;"></span></sc-for>
            </div>
          </div>
          <button type="button" style="width: 92px; height: 48px; flex-shrink: 0; border: 1px solid {{b.bd}}; border-radius: 4px; background: {{b.bg}}; color: {{b.fg}}; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 500; cursor: pointer;">{{b.cost}}</button>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 844, "height": 390}}'>
class Component extends DCLogic {
  renderVals() {
    const pips = (n, max) => Array.from({ length: max }, (_, i) => ({ fill: i < n ? '#5B8CFF' : '#262C38' }));
    const buy = { bd: '#5B8CFF', bg: 'rgba(91,140,255,0.12)', fg: '#8FB0FF' };
    const max = { bd: '#262C38', bg: 'transparent', fg: '#7A8397' };
    return { boosts: [
      { name: 'Extra life', effect: '+1 life', cost: '4,000', rankLabel: 'Rank 0 of 2', pips: pips(0, 2), ...buy },
      { name: 'Compact hull', effect: '\u22126% hitbox', cost: '3,000', rankLabel: 'Rank 1 of 3', pips: pips(1, 3), ...buy },
      { name: 'Enemy slow', effect: '\u22124% speed', cost: '2,000', rankLabel: 'Rank 0 of 3', pips: pips(0, 3), ...buy },
      { name: 'Score', effect: '+10% score', cost: '6,500', rankLabel: 'Rank 2 of 4', pips: pips(2, 4), ...buy },
      { name: 'Points', effect: '+10% points', cost: 'Max', rankLabel: 'Rank 4 of 4', pips: pips(4, 4), ...max }
    ] };
  }
}
</script>
</body>
</html>
