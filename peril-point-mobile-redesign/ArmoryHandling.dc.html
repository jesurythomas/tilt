<div style="width: 844px; height: 390px; box-sizing: border-box; background: #0B0E14; display: flex; flex-direction: column; overflow: hidden; color: #E6E9F0; font-family: 'IBM Plex Sans', sans-serif;">

        <span style="font-size: 12px; color: #99A1B3;">Higher turns sharper.</span>

        <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; color: #7A8397; margin-top: -6px;"><span>0.5×</span><span>2.0×</span></div>

      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <label for="h-tilt" style="font-size: 15px; font-weight: 600;">Tilt sensitivity</label>
          <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 500; color: #5B8CFF;">1.2×</span>
        </div>
        <span style="font-size: 12px; color: #99A1B3;">Less wrist for full speed.</span>

        <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; color: #7A8397; margin-top: -6px;"><span>0.5×</span><span>2.0×</span></div>

      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; color: #7A8397;">Live preview — tilt or drag</span>
      <div style="flex-grow: 1; position: relative; background-color: #0D1016; background-image: linear-gradient(rgba(91,140,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(91,140,255,0.05) 1px, transparent 1px); background-size: 34px 34px; border: 1px solid #262C38; border-radius: 8px; overflow: hidden;">

      </div>
    </div>

</div>
