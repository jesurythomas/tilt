<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#08090E;color:#E6E9F0;font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#C7CDDB}a:hover{color:#E6E9F0}
button{font-family:'IBM Plex Sans',sans-serif}
</style>
</helmet>
<div style="width: 844px; height: 390px; position: relative; overflow: hidden; box-sizing: border-box; background-color: #0D1016; background-image: linear-gradient(rgba(91,140,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(91,140,255,0.05) 1px, transparent 1px); background-size: 34px 34px; color: #E6E9F0; font-family: 'IBM Plex Sans', sans-serif;">
  <div style="position: absolute; left: 16px; top: 10px; right: 16px; bottom: 10px; border: 1px solid rgba(91,140,255,0.28); border-radius: 2px;"></div>
  <sc-for list="{{dots}}" as="d" hint-placeholder-count="8"><div style="position: absolute; left: {{d.x}}px; top: {{d.y}}px; width: {{d.s}}px; height: {{d.s}}px; border-radius: 50%; background: #FF4757; box-shadow: 0 0 10px rgba(255,71,87,0.75);"></div></sc-for>
  <div style="position: absolute; left: 238px; top: 188px; width: 64px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, rgba(91,140,255,0), rgba(91,140,255,0.35));"></div>
  <div style="position: absolute; left: 294px; top: 175px;"><svg width="36" height="36" viewBox="0 0 40 40" fill="none" aria-hidden="true" style="filter: drop-shadow(0 0 14px rgba(91,140,255,0.9));"><path d="M34 20 L11 8 L16 20 L11 32 Z" fill="#5B8CFF"></path></svg></div>

  <div style="position: absolute; left: 32px; top: 26px; display: flex; flex-direction: column; gap: 10px;">
    <h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 700; font-size: 42px; line-height: 0.9; letter-spacing: -0.015em; color: #E6E9F0;">PERIL<br>POINT</h1>
    <p style="margin: 0; font-size: 14px; color: #99A1B3;">Move to dodge. The guns fire themselves.</p>
  </div>

  <div style="position: absolute; left: 32px; bottom: 24px; width: 392px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #7A8397; width: 48px;">Steer</span>
      <div style="width: 176px;"><div style="display: flex; box-sizing: border-box; height: 48px; padding: 3px; gap: 3px; background: #0D1016; border: 1px solid #262C38; border-radius: 6px;"><button type="button" aria-pressed="false" style="flex-grow: 1; height: 100%; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #7A8397; font-size: 14px; font-weight: 500; cursor: pointer; padding: 0 14px;">Touch</button><button type="button" aria-pressed="true" style="flex-grow: 1; height: 100%; border: 1px solid #3A4252; border-radius: 4px; background: #1B2029; color: #E6E9F0; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0 14px;">Tilt</button></div></div>
      <a href="Calibrate.dc.html" aria-label="Calibrate tilt" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: 48px; height: 48px; flex-shrink: 0; border: 1px solid #262C38; border-radius: 6px; background: rgba(20,24,33,0.85); text-decoration: none; cursor: pointer; padding: 0;"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="#C7CDDB" stroke-width="1.3"></circle><circle cx="9.5" cy="6.8" r="1.8" fill="#C7CDDB"></circle><path d="M8 1 V3 M8 13 V15 M1 8 H3 M13 8 H15" stroke="#C7CDDB" stroke-width="1.3" stroke-linecap="round"></path></svg></a>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 28px; padding-top: 14px; border-top: 1px solid #1B2029;">
      <div style="display: flex; flex-direction: column; gap: 3px;"><span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; color: #7A8397;">Best</span><span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 500; color: #E6E9F0;">32,420</span></div>
      <div style="display: flex; flex-direction: column; gap: 3px;"><span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; color: #7A8397;">Points</span><span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 500; color: #FFB14D;">7,331</span></div>
      <div style="display: flex; flex-direction: column; gap: 3px;"><span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; color: #7A8397;">Milestones</span><span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 500; color: #E6E9F0;">14<span style="color: #7A8397;">/36</span></span></div>
    </div>
  </div>

  <div style="position: absolute; top: 0; right: 0; bottom: 0; width: 372px; box-sizing: border-box; padding: 22px 30px 22px 24px; background: rgba(8,9,14,0.92); border-left: 1px solid #262C38; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="display: flex; align-items: center; gap: 12px; height: 56px; box-sizing: border-box; padding: 0 14px 0 12px; background: {{m.bg}}; border: 1px solid {{m.border}}; border-radius: 6px; cursor: pointer; text-align: left;">
        <span style="width: 3px; height: 30px; border-radius: 2px; background: {{m.tint}}; display: block; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 600; color: {{m.fg}};">{{m.name}}</span>
          <span style="font-size: 12px; color: {{m.sub}};">{{m.desc}}</span>
        </span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 500; color: {{m.tint}};">{{m.mult}}</span>
        <span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{m.ring}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{m.dot}}; display: block;"></span></span>
      </button>
    </sc-for>
    <div style="flex-grow: 1;"></div>
    <a href="ColdOpen.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; border: none; border-radius: 6px; background: #5B8CFF; color: #08090E; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer; height: 56px; font-size: 18px;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 2.5 L13 8 L4 13.5 Z" fill="#08090E"></path></svg>Play</a>
    <div style="display: flex; gap: 8px; margin-top: 2px;">
      <a href="ArmoryWeapons.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; height: 48px; border: 1px solid #3A4252; border-radius: 6px; background: transparent; color: #C7CDDB; font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; flex-grow: 1;">Armory</a>
      <a href="Milestones.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; height: 48px; border: 1px solid #3A4252; border-radius: 6px; background: transparent; color: #C7CDDB; font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; flex-grow: 1;">Milestones</a>
      <a href="Settings.dc.html" aria-label="Settings" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: 48px; height: 48px; flex-shrink: 0; border: 1px solid #262C38; border-radius: 6px; background: rgba(20,24,33,0.85); text-decoration: none; cursor: pointer; padding: 0; background: transparent; border-color: #3A4252;"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.4" stroke="#C7CDDB" stroke-width="1.3"></circle><path d="M8 1.6 V3.4 M8 12.6 V14.4 M1.6 8 H3.4 M12.6 8 H14.4 M3.5 3.5 L4.7 4.7 M11.3 11.3 L12.5 12.5 M12.5 3.5 L11.3 4.7 M4.7 11.3 L3.5 12.5" stroke="#C7CDDB" stroke-width="1.3" stroke-linecap="round"></path></svg></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 844, "height": 390}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'standard' }; }
  renderVals() {
    const base = [
      { id: 'standard', name: 'Standard', desc: 'The full arsenal.', mult: '1.0\u00d7', tint: '#5B8CFF' },
      { id: 'gauntlet', name: 'Gauntlet', desc: 'Walls close in.', mult: '1.25\u00d7', tint: '#FFB14D' },
      { id: 'codered', name: 'Code Red', desc: 'Double density.', mult: '1.5\u00d7', tint: '#A78BFA' }
    ];
    return {
      dots: [{x:118,y:168,s:6},{x:176,y:214,s:5},{x:232,y:150,s:6},{x:262,y:238,s:5},{x:338,y:138,s:6},{x:362,y:226,s:5},{x:406,y:180,s:6},{x:150,y:256,s:5},{x:300,y:262,s:6},{x:212,y:118,s:5},{x:440,y:250,s:5}],
      modes: base.map((m) => {
        const on = m.id === this.state.mode;
        return { ...m, pressed: on ? 'true' : 'false', bg: on ? '#141821' : '#0F131B', border: on ? m.tint : '#262C38',
          fg: on ? '#E6E9F0' : '#C7CDDB', sub: on ? '#99A1B3' : '#7A8397', ring: on ? m.tint : '#3A4252', dot: on ? m.tint : 'transparent',
          pick: () => this.setState({ mode: m.id }) };
      })
    };
  }
}
</script>
</body>
</html>
