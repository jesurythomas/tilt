// The PerilGames Godot Android plugin (ruling PGS R1). Build with tools/build_games_plugin.sh,
// which copies the two AARs into godot/addons/peril_games/bin/. The SDK is compileOnly: an AAR
// file carries no dependencies, so godot/addons/peril_games/peril_games_plugin.gd hands the same
// coordinate to the game's gradle build. Keep the version in step with that file.
plugins {
    id 'com.android.library' version '8.6.1'
}

android {
    namespace 'com.jtg.perilpoint.games'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.2.stable'
    compileOnly 'com.google.android.gms:play-services-games-v2:22.1.0'
}
